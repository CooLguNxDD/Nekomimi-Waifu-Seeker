[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waifu-determination-engine"
version = "0.2.0"
description = "Nekomimi ACG character guesser: web search for candidates, Laya for every decision"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "ddgs>=9.0.0",
]

[project.optional-dependencies]
laya = ["laya>=0.3.0"]
dml = ["onnxruntime-directml", "onnx"]
playwright = ["playwright>=1.49"]
gemini = ["google-genai>=1.51.0"]
dev = ["pytest>=8.0", "google-genai>=1.51.0"]

[project.scripts]
waifu-engine = "waifu_engine.cli:main"

[tool.setuptools.packages.find]
include = ["waifu_engine*"]

[tool.setuptools.package-data]
"waifu_engine.nekomimi" = ["question_bank.json"]
"waifu_engine" = ["webui_dist/**/*"]