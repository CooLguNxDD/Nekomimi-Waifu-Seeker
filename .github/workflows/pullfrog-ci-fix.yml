# Auto-fix CI failures on PR branches — BOT-AUTHORED PRs only by default.
# only_bot_prs is enforced in pullfrog.yml (config.yml). Fail closed.
name: Pullfrog CI fix

on:
  check_suite:
    types: [completed]

concurrency:
  group: pullfrog-ci-fix-${{ github.repository }}-${{ (github.event.check_suite && github.event.check_suite.pull_requests[0] && github.event.check_suite.pull_requests[0].number) || github.event.check_suite.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  fix:
    if: |
      github.event.check_suite.conclusion == 'failure' &&
      github.event.check_suite.head_branch != github.event.repository.default_branch
    permissions:
      contents: write
      id-token: write
      pull-requests: write
      issues: write
      checks: write
      actions: read
      statuses: write
    uses: ./.github/workflows/pullfrog.yml
    with:
      name: "CI fix ${{ github.event.check_suite.head_sha }}"
      feature: ci_fix
      timeout: 60m
      # model/effort: repo vars PULLFROG_MODEL / PULLFROG_EFFORT (see pullfrog.yml)
      prompt: |
        You are Pullfrog running fully locally on repo (no hosted dashboard).
        Read `.github/pullfrog/instructions/build.md` if present.

        Mode hint: Fix — a CI check suite failed on a bot-authored PR.
        Inspect failed checks/logs, fix the root cause on the PR branch, push, and summarize.

        Guardrails:
        - Do nothing if failures are only external services you cannot fix.
        - If recent commits already contain [pullfrog-ci-fix] more than twice, stop
          and comment that max attempts were reached.
        - Prefer a single focused fix commit whose message includes [pullfrog-ci-fix].
        - Skip if this failure is from a Pullfrog workflow itself (avoid loops).
        - Keep the fix minimal; do not refactor unrelated code.

        Trigger event details are available in the file `.github/pullfrog/event.json`.
        Read that file to understand the event context.
    secrets: inherit
