name: Sync Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: huggingface-space-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
          persist-credentials: false

      - name: Require main for manual sync
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
        run: |
          echo "Manual syncs must be run from main." >&2
          exit 1

      - name: Push repository to Hugging Face Space
        env:
          HF_SPACE: cclemonExp/Nekomimi-Waifu-Seeker
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$HF_TOKEN" ]]; then
            echo "Set the HF_TOKEN Actions secret to a write-enabled Hugging Face token." >&2
            exit 1
          fi

          git lfs install
          git remote add huggingface "https://huggingface.co/spaces/${HF_SPACE}"
          auth_header="$(printf 'hf_user:%s' "$HF_TOKEN" | base64 -w 0)"
          git -c "http.https://huggingface.co/.extraheader=AUTHORIZATION: Basic ${auth_header}" \
            push --force huggingface HEAD:main
