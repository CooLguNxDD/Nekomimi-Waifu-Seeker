# Series-field spellings that are one work. same_series folds these keys.
# "Spice & Wolf" and "Ookami to Koushinryou" share no prefix, so the merchant
# and the wolf used to look like different works and near-twin defer never
# asked about ears. Search markers stay in `markers`.
series_folds:
  - label: Spice and Wolf
    phrases:
      - spice and wolf
      - spice & wolf
      - spice wolf
      - ookami to koushinryou
      - ookami to koshinryo
      - ookami to ningen

